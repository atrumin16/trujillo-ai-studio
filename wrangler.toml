name = "groq-discord-bot"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
# Static /assets are free (no Worker). Worker only for HTML/API.
run_worker_first = ["!/assets/*", "!/avatar.png", "!/favicon.ico", "/*"]

[triggers]
crons = ["0 7 * * *"]

[observability]
enabled = true
head_sampling_rate = 0.01

[vars]
GROQ_MODEL = "openai/gpt-oss-120b"
SITE_DOMAIN = "ai.trujillomingorance.com"
DISCORD_APPLICATION_ID = "1538306837240225842"
