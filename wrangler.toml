name = "trujillo-ai-studio"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = true

# Optional: Add your custom domain routes in Cloudflare
# routes = [
#   { pattern = "ai.yourdomain.com", custom_domain = true }
# ]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
# Edge routing for static assets
run_worker_first = ["/*"]

[triggers]
crons = ["0 7 * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
GROQ_MODEL = "openai/gpt-oss-120b"
SITE_DOMAIN = "ai.example.com"
OWNER_EMAILS = "admin@example.com"
OWNER_DISCORD_IDS = ""
DISCORD_APPLICATION_ID = "YOUR_DISCORD_APPLICATION_ID"
DISCORD_PUBLIC_KEY = "YOUR_DISCORD_PUBLIC_KEY"

[[kv_namespaces]]
binding = "BOT_MEMORY"
id = "YOUR_KV_NAMESPACE_ID"
