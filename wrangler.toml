name = "groq-discord-bot"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
# Skip Worker only for THIS app's static files. Do not use !/assets/*
# or alberto/guides hashed /assets/main-*.css never get proxied.
run_worker_first = [
  "!/assets/app.js",
  "!/assets/app.css",
  "!/assets/site.js",
  "!/assets/site.css",
  "!/assets/i18n.js",
  "!/assets/i18n/*",
  "!/assets/icon.png",
  "!/avatar.png",
  "!/favicon.ico",
  "/*"
]

[triggers]
crons = ["0 7 * * *"]

[observability]
enabled = true
head_sampling_rate = 0.01

